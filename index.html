let flipped=false;let station=0;let conveyorX=-.28;const beltStops=[-.28,.48,1.22,1.96];function moveBelt(step){if(stage!=='plate'){tell('Primero pasa la tortilla del comal a la cinta.');return}if(falling.length){tell('Espera a que caiga el ingrediente.');return}const idx=beltStops.reduce((best,x,i)=>Math.abs(x-conveyorX)<Math.abs(beltStops[best]-conveyorX)?i:best,0);const next=Math.max(0,Math.min(3,idx+step));const old=conveyorX;conveyorX=beltStops[next];const dx=conveyorX-old;if(tortilla)tortilla.position.x+=dx;pieces.forEach(p=>p.position.x+=dx);setStation(next===0?1:next===3?3:2);tell('Cinta: '+['CARNE','CILANTRO','CEBOLLA','SALSA'][next]);}const stationTitle=document.querySelector('#stationTitle');const stationActions=[['heat','flip','move'],[],['chop'],[]];const stationNames=['1 · COMAL','2 · CARNE','3 · VERDURAS','4 · SALSA Y ENTREGA'];const stationViews=[[0,2.05,4.1],[0,2.05,4.1],[0,2.05,4.1],[0,2.05,4.1]];function setStation(n){station=Math.max(0,Math.min(3,n));stationTitle.textContent='Estación '+stationNames[station];document.querySelectorAll('[data-action]').forEach(b=>b.classList.toggle('station-active',false));const v=stationViews[station];camera.position.set(v[0],v[1],v[2]);yaw=0;pitch=-.21;camera.rotation.set(pitch,yaw,0)}setStation(0);

if(action==='move'){if(stage!=='comal'){tell('Pon primero la tortilla en el comal.');return}const elapsed=performance.now()-heatAt;if(elapsed<1200||!flipped){tell('Primero voltea y calienta la tortilla.');return}if(limit===50&&elapsed>7500){clearTaco();tell('🔥 ¡Se quemó! Pon otra tortilla.');return}hands();stage='plate';conveyorX=-.28;tortilla.position.set(conveyorX,1.34,-.67);tell('Tortilla en la cinta. Presiona CARNE.');setStation(1);return}

if(stage!=='plate'){tell('Primero calienta la tortilla y pásala al plato.');setStation(0);return}
if(added.includes(action)){tell('Ese ingrediente ya está puesto.');return}const targetStop={meat:-.28,cilantro:.48,onion:1.22,salsa:1.96}[action];if(targetStop!==undefined&&Math.abs(conveyorX-targetStop)>.12){tell('Mueve la cinta con las flechas hasta '+names[action]+'.');return}if(action==='onion'&&onionStock===0){tell('🧅 No queda cebolla. ¡Pica más!');return}

let lastFrame=performance.now();function render(){requestAnimationFrame(render);const now=performance.now(),dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;if(playing){camera.rotation.set(pitch,yaw,0);const forward=(pressed.has('forward')?1:0)-(pressed.has('back')?1:0)-joyY,strafe=(pressed.has('right')?1:0)-(pressed.has('left')?1:0)+joyX;const speed=2.3*dt;for(const stripe of beltStripes){stripe.position.x+=((conveyorX-beltStops[0])!==0?.0009:0);if(stripe.position.x>2.35)stripe.position.x=-.8}const remaining=Math.max(0,(deadline-performance.now())/1000);timerEl.textContent=remaining.toFixed(1);timerEl.classList.toggle('urgent',remaining<=5);if(!leaving&&remaining<=0)loseCustomer();if(customer){const target=leaving?-2.5:0;customer.position.x+=(target-customer.position.x)*.055;const walking=Math.abs(target-customer.position.x)>.035;const swing=walking?Math.sin(performance.now()*.013)*.42:0;customer.rotation.y=leaving?Math.PI:0;customer.userData.leftLeg.rotation.x=swing;customer.userData.rightLeg.rotation.x=-swing;customer.userData.leftArm.rotation.x=-swing*.7;customer.userData.rightArm.rotation.x=swing*.7;customer.position.y=walking?Math.abs(Math.sin(performance.now()*.013))*.025:0;}const moving=performance.now()<handUntil;handRight.visible=moving;handRight.rotation.x=moving?Math.sin(performance.now()*.032)*.38:0;handRight.rotation.z=moving?Math.sin(performance.now()*.025)*.12:0;for(let i=falling.length-1;i>=0;i--){const p=falling[i];if(p.delay>0){p.delay-=dt;continue}p.velocity+=dt*9;p.progress=Math.min(1,p.progress+dt*2.8);p.mesh.position.x=p.startX+(p.targetX-p.startX)*p.progress;p.mesh.position.z=p.startZ+(p.targetZ-p.startZ)*p.progress;p.mesh.position.y=Math.max(p.targetY,p.mesh.position.y-p.velocity*dt);if(p.progress>=1&&p.mesh.position.y<=p.targetY)falling.splice(i,1)}if(limit===50&&stage==='comal'&&tortilla&&performance.now()-heatAt>7500)tortilla.material.color.setHex(0x503021);}renderer.render(scene,camera)}render();addEventListener('resize',()=>{camera.a
