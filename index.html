<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TacoGame 3D · Prototipo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#122235;color:white;font-family:system-ui,Arial,sans-serif;overflow:hidden}canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.panel{background:#071528d9;border:1px solid #ffffff44;border-radius:13px;padding:11px;max-width:75%}
#notice{position:fixed;top:118px;left:50%;transform:translateX(-50%);background:#071528df;border-radius:10px;padding:8px 12px;text-align:center;font-size:13px;width:max-content;max-width:90%}
#buttons{position:fixed;bottom:80px;left:8px;right:8px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-height:90px;overflow-y:auto}button{background:#1c466e;border:1px solid #ffffff55;border-radius:10px;padding:12px 10px;color:white;font-weight:700;cursor:pointer}button:active{transform:scale(.97)}button.primary{background:#bd6014}
#movePad{position:fixed;bottom:174px;left:12px;display:grid;grid-template-columns:repeat(3,42px);gap:4px;z-index:3}#movePad button{padding:8px;min-height:42px;touch-action:none;background:#142b48bb}#lookPad{position:fixed;right:12px;bottom:174px;z-index:3;display:flex;gap:5px}#lookPad button{touch-action:none;background:#142b48bb}#hint{position:fixed;top:66px;left:12px;background:#071528a8;padding:4px 8px;border-radius:8px;font-size:11px;pointer-events:none}#setup{position:fixed;inset:0;background:#071322ee;z-index:10;display:grid;place-items:center;padding:20px}#setup .dialog{max-width:420px;text-align:center;background:#17314c;border:1px solid #ffffff44;border-radius:20px;padding:26px}#setup button{margin:5px}#timer{font-size:20px;font-weight:900}#timer.urgent{color:#ff6969}#apron{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:205px;height:74px;background:#15528d;border:4px solid #0c3969;border-bottom:0;border-radius:50% 50% 0 0;text-align:center;padding-top:26px;font-weight:900;font-size:13px;pointer-events:none}
@media(max-width:700px){button{font-size:12px;padding:9px 7px}.panel{font-size:12px;padding:8px}#notice{top:94px}#hint{display:none}#movePad{bottom:184px;left:8px;grid-template-columns:repeat(3,38px)}#movePad button{min-height:38px}#lookPad{bottom:184px;right:8px}#lookPad button{padding:8px}#buttons{bottom:76px;max-height:92px}#apron{width:150px;height:55px;padding-top:18px;font-size:10px}}
#movePad,#lookPad{display:none!important}#joystick{position:fixed;left:17px;bottom:105px;width:112px;height:112px;border-radius:50%;border:2px solid #ffffff55;background:#132a4499;touch-action:none;z-index:5}#stick{position:absolute;width:48px;height:48px;left:30px;top:30px;border-radius:50%;background:#d9e5f4aa;border:2px solid white;pointer-events:none}#actionToggle{position:fixed;right:15px;bottom:118px;z-index:7;border-radius:30px;padding:13px 17px;background:#c46d22}#buttons{display:none;bottom:184px;left:auto;right:10px;width:min(245px,60vw);max-height:45vh;overflow:auto;justify-content:flex-end;background:#071528c9;border-radius:15px;padding:8px;z-index:6}#buttons.open{display:flex}#buttons button{font-size:11px;padding:8px 9px}canvas{touch-action:none}@media(max-width:700px){#joystick{bottom:98px}#actionToggle{bottom:112px}#buttons{bottom:175px}}
</style>
</head>
<body>
<div id="hud"><div class="panel"><strong>🌮 TacoGame 3D</strong><div id="order">Preparando pedido...</div></div><div class="panel">🪙 <span id="coins">0</span> · ⭐ <span id="served">0</span><div>⏱️ <span id="timer">--</span> s</div><div>😡 Perdidos: <span id="lost">0</span></div></div></div>
<div id="setup"><div class="dialog"><h1>🌮 TacoGame 3D</h1><p>¡Atiende a los clientes antes de que se enojen!</p><p>Elige dificultad:</p><button data-difficulty="25">😊 Fácil · 25 s</button><button data-difficulty="20">🙂 Medio · 20 s</button><button data-difficulty="15">🔥 Difícil · 15 s</button></div></div><div id="hint">WASD: caminar · Flechas: mirar · Celular: controles</div><div id="movePad"><span></span><button data-control="forward">▲</button><span></span><button data-control="left">◀</button><button data-control="back">▼</button><button data-control="right">▶</button></div><div id="lookPad"><button data-control="lookLeft">↶ Mirar</button><button data-control="lookRight">Mirar ↷</button></div><div id="notice">¡Calienta una tortilla para comenzar!</div>
<div id="joystick"><div id="stick"></div></div><button id="actionToggle" type="button">Acciones</button><div id="buttons">
<button data-action="heat">🔥 Comal</button><button data-action="move">🥞 Pasar al plato</button><button data-action="chop">🔪 Picar cebolla</button><button data-action="meat">🥩 Carne</button><button data-action="cilantro">🌿 Cilantro</button><button data-action="onion">🧅 Cebolla</button><button data-action="salsa">🌶️ Salsa</button><button class="primary" data-action="serve">✅ Entregar</button>
</div><div id="apron">EL TACONAZO</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc9ee);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);camera.position.set(0,1.7,3.6);let yaw=0,pitch=-.13;camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x88603c,2.1));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,7,4);scene.add(light);
function box(x,y,z,w,h,d,color){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));o.position.set(x,y,z);scene.add(o);return o}
function disk(x,y,z,r,h,color){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),new THREE.MeshStandardMaterial({color}));o.position.set(x,y,z);scene.add(o);return o}
box(0,-.1,0,18,.2,18,0xc78c54);box(0,.55,-.6,3.8,.95,1.3,0xc44e24);box(0,1.08,-.6,4,.12,1.5,0xbababa);
for(const x of [-1.9,1.9])box(x,2,-.6,.09,2.1,.09,0x86532d);
box(0,3.08,-.6,4.2,.18,1.9,0xe9a629);
for(let i=0;i<9;i++)box(-1.8+i*.45,3.15,.25,.24,.09,.18,[0xd44d2d,0xf3c844,0x21894d][i%3]);
box(-.75,1.19,-.6,1.12,.12,.95,0x292c30);box(-.75,1.26,-.6,1.02,.025,.85,0x42464a);disk(.72,1.2,-.6,.48,.08,0xe7d4b7);box(1.45,1.19,.7,.65,.06,.48,0xb77b42);
for(const [x,color] of [[-1.65,0x914323],[-1.3,0x238a3b],[1.4,0xe4dfbb],[1.72,0xb52820]])disk(x,1.22,.04,.15,.18,color);
const orderEl=document.querySelector('#order'),noticeEl=document.querySelector('#notice'),coinsEl=document.querySelector('#coins'),servedEl=document.querySelector('#served'),timerEl=document.querySelector('#timer'),lostEl=document.querySelector('#lost');
let tortilla=null,pieces=[],added=[],order=[],coins=0,served=0,lost=0,limit=25,deadline=0,playing=false,customer=null,leaving=false;
let stage='none',heatAt=0,onionStock=0,handUntil=0;const choppedOnionPieces=[];
scene.add(camera);const pressed=new Set();const controls={KeyW:'forward',KeyS:'back',KeyA:'left',KeyD:'right',ArrowLeft:'lookLeft',ArrowRight:'lookRight',ArrowUp:'lookUp',ArrowDown:'lookDown'};addEventListener('keydown',e=>{if(controls[e.code]){pressed.add(controls[e.code]);e.preventDefault()}});addEventListener('keyup',e=>{pressed.delete(controls[e.code])});document.querySelectorAll('[data-control]').forEach(b=>{const k=b.dataset.control;b.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(k);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>pressed.delete(k))});
const joy=document.querySelector('#joystick'),stick=document.querySelector('#stick');let joyX=0,joyY=0,joyPointer=null;
function setJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),dist=Math.hypot(dx,dy),scale=Math.min(1,44/Math.max(1,dist));joyX=dx*scale/44;joyY=dy*scale/44;stick.style.transform='translate('+dx*scale+'px,'+dy*scale+'px)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);setJoy(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)setJoy(e)});
function resetJoy(e){if(e.pointerId!==joyPointer)return;joyPointer=null;joyX=joyY=0;stick.style.transform=''}
joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
const actions=document.querySelector('#buttons');document.querySelector('#actionToggle').onclick=()=>actions.classList.toggle('open');
let lookPointer=null,lastLookX=0,lastLookY=0;
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.38)return;lookPointer=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookPointer||!playing)return;yaw-=(e.clientX-lastLookX)*.004;pitch=Math.max(-.8,Math.min(.7,pitch-(e.clientY-lastLookY)*.003));lastLookX=e.clientX;lastLookY=e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookPointer)lookPointer=null});
renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===lookPointer)lookPointer=null});
function makeHand(x){const g=new THREE.Group();const material=new THREE.MeshStandardMaterial({color:0xdca170});const sleeve=new THREE.Mesh(new THREE.BoxGeometry(.17,.22,.21),new THREE.MeshStandardMaterial({color:0x15508a}));sleeve.position.y=-.18;g.add(sleeve);const forearm=new THREE.Mesh(new THREE.CylinderGeometry(.075,.09,.45,8),material);forearm.position.y=-.49;g.add(forearm);const palm=new THREE.Mesh(new THREE.BoxGeometry(.19,.14,.18),material);palm.position.y=-.76;g.add(palm);for(let i=0;i<4;i++){const finger=new THREE.Mesh(new THREE.BoxGeometry(.035,.12,.05),material);finger.position.set(-.06+i*.04,-.87,-.03);g.add(finger)}g.position.set(x,-.12,-.75);camera.add(g);return g}
const handRight=makeHand(.52);handRight.visible=false;handRight.scale.set(.85,.85,.85);handRight.position.set(.48,-.06,-.7);
function hands(){handUntil=performance.now()+450}
function chopVisual(){const portion=[];for(let i=0;i<9;i++){const p=box(1.2+Math.random()*.45,1.25,.5+Math.random()*.35,.04,.025,.04,0xece9d5);portion.push(p)}choppedOnionPieces.push(portion)}
function useChoppedOnion(){const portion=choppedOnionPieces.shift();if(portion)for(const p of portion){if(p&&p.parent)p.parent.remove(p)}}

const names={meat:'carne',cilantro:'cilantro',onion:'cebolla',salsa:'salsa'};
let noticeTimer=null;function tell(t){noticeEl.textContent=t;noticeEl.style.opacity='1';if(noticeTimer)clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{noticeEl.style.opacity='0';noticeEl.style.pointerEvents='none'},2400)}
function makeCustomer(){
const group=new THREE.Group();
function part(geometry,color,x,y,z){const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color}));mesh.position.set(x,y,z);group.add(mesh);return mesh}
part(new THREE.BoxGeometry(.52,.75,.28),0x2d79a5,0,1.05,0);
part(new THREE.SphereGeometry(.23,18,12),0xe4a36b,0,1.65,0);
const leftLeg=part(new THREE.BoxGeometry(.19,.62,.2),0x263e63,-.16,.36,0);
const rightLeg=part(new THREE.BoxGeometry(.19,.62,.2),0x263e63,.16,.36,0);
const leftArm=part(new THREE.BoxGeometry(.14,.6,.18),0xe4a36b,-.34,1.1,0);
const rightArm=part(new THREE.BoxGeometry(.14,.6,.18),0xe4a36b,.34,1.1,0);
for(const x of [-.09,.09])part(new THREE.SphereGeometry(.024,8,8),0x222222,x,1.69,.213);
const mouth=part(new THREE.BoxGeometry(.15,.025,.015),0x652d24,0,1.55,.224);group.userData={mouth,leftLeg,rightLeg,leftArm,rightArm};
group.position.set(0,0,-2.6);scene.add(group);return group;
}
function clearTaco(){if(tortilla){scene.remove(tortilla);tortilla=null}stage='none';pieces.forEach(p=>scene.remove(p));pieces=[];added=[]}
function nextOrder(){clearTaco();const opts=[['meat','cilantro','onion'],['meat','cilantro'],['meat','onion','salsa'],['meat','cilantro','onion','salsa']];order=opts[Math.floor(Math.random()*opts.length)];orderEl.textContent='Pedido: '+order.map(x=>names[x]).join(', ');if(customer)scene.remove(customer);customer=makeCustomer();customer.position.x=2.5;deadline=performance.now()+limit*1000;leaving=false}
function loseCustomer(){if(leaving)return;leaving=true;lost++;lostEl.textContent=lost;tell('😡 ¡El cliente se enojó y se fue sin pagar!');customer.userData.mouth.scale.y=4;setTimeout(()=>{if(!playing)return;nextOrder();tell('¡Llegó otro cliente! Prepara su pedido.')},1100)}
document.querySelectorAll('[data-difficulty]').forEach(b=>b.addEventListener('click',()=>{limit=Number(b.dataset.difficulty);document.querySelector('#setup').style.display='none';playing=true;nextOrder();tell('¡Llegó tu primer cliente! Calienta una tortilla.')}));
function sprinkle(color){for(let i=0;i<14;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(.032,7,6),new THREE.MeshStandardMaterial({color}));const angle=Math.random()*Math.PI*2,rad=Math.sqrt(Math.random())*.28;p.position.set(.72+Math.cos(angle)*rad,1.29+added.length*.014,-.6+Math.sin(angle)*rad);scene.add(p);pieces.push(p)}}
function act(action){
if(!playing||leaving)return;
if(action==='chop'){hands();onionStock+=1;chopVisual();tell('🔪 Cebolla picada. Porciones: '+onionStock);return}
if(action==='heat'){clearTaco();hands();tortilla=disk(-.75,1.33,-.6,.33,.025,0xf3cc7d);stage='comal';heatAt=performance.now();tell('🔥 Tortilla en el comal. Espera 2 segundos.');return}
if(action==='move'){if(stage!=='comal'){tell('Pon primero la tortilla en el comal.');return}const elapsed=performance.now()-heatAt;if(elapsed<2000){tell('¡La tortilla sigue fría!');return}if(elapsed>7500){clearTaco();tell('🔥 ¡Se quemó! Pon otra tortilla.');return}hands();stage='plate';tortilla.position.set(.72,1.29,-.6);tell('🥞 ¡Pasaste la tortilla al plato! Agrega carne.');return}
if(action==='serve'){
if(stage!=='plate'){tell('Primero calienta la tortilla y pásala al plato.');return}
const correct=order.every(x=>added.includes(x))&&added.every(x=>order.includes(x));
if(correct){coins+=10;served++;coinsEl.textContent=coins;servedEl.textContent=served;tell('¡Pedido correcto! +10 monedas 🎉');nextOrder()}
else{tell('❌ Pedido incorrecto. ¡El mismo cliente sigue esperando! Rehaz el taco.');clearTaco()}
return}
if(stage!=='plate'){tell('Primero calienta la tortilla y pásala al plato.');return}
if(added.includes(action)){tell('Ese ingrediente ya está puesto.');return}if(action==='onion'&&onionStock===0){tell('🧅 No queda cebolla. ¡Pica más!');return}
if(action!=='meat'&&!added.includes('meat')){tell('Primero agrega carne.');return}
if(action==='onion'){onionStock--;useChoppedOnion()}hands();added.push(action);sprinkle(({meat:0x824022,cilantro:0x238b38,onion:0xf3e9c8,salsa:0xb51f16})[action]);tell('Agregaste '+names[action]);
}
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));
let lastFrame=performance.now();function render(){requestAnimationFrame(render);const now=performance.now(),dt=Math.min((now-lastFrame)/1000,.05);lastFrame=now;if(playing){if(pressed.has('lookLeft'))yaw+=dt*1.7;if(pressed.has('lookRight'))yaw-=dt*1.7;if(pressed.has('lookUp'))pitch=Math.min(.7,pitch+dt);if(pressed.has('lookDown'))pitch=Math.max(-.8,pitch-dt);camera.rotation.set(pitch,yaw,0);const forward=(pressed.has('forward')?1:0)-(pressed.has('back')?1:0)-joyY,strafe=(pressed.has('right')?1:0)-(pressed.has('left')?1:0)+joyX;const speed=2.3*dt;camera.position.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*strafe)*speed;camera.position.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*strafe)*speed;camera.position.x=Math.max(-3.4,Math.min(3.4,camera.position.x));camera.position.z=Math.max(1.1,Math.min(5,camera.position.z));const remaining=Math.max(0,(deadline-performance.now())/1000);timerEl.textContent=remaining.toFixed(1);timerEl.classList.toggle('urgent',remaining<=5);if(!leaving&&remaining<=0)loseCustomer();if(customer){const target=leaving?-2.5:0;customer.position.x+=(target-customer.position.x)*.055;const walking=Math.abs(target-customer.position.x)>.035;const swing=walking?Math.sin(performance.now()*.013)*.42:0;customer.rotation.y=leaving?Math.PI:0;customer.userData.leftLeg.rotation.x=swing;customer.userData.rightLeg.rotation.x=-swing;customer.userData.leftArm.rotation.x=-swing*.7;customer.userData.rightArm.rotation.x=swing*.7;customer.position.y=walking?Math.abs(Math.sin(performance.now()*.013))*.025:0;}const moving=performance.now()<handUntil;handRight.visible=moving;handRight.rotation.x=moving?Math.sin(performance.now()*.032)*.38:0;handRight.rotation.z=moving?Math.sin(performance.now()*.025)*.12:0;if(stage==='comal'&&performance.now()-heatAt>7500)tortilla.material.color.setHex(0x503021);}renderer.render(scene,camera)}render();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
